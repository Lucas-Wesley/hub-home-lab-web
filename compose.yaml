name: hub

services:
  hub:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: hub:${VERSION:-dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    # PROXMOX_TOKEN (usuário só de leitura, ver docs/DECISOES.md H3) fica no .env, fora do Git.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
